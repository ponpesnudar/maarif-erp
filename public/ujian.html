<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ujian · SIPP NU Darussalam</title>
<script src="/vendor/vue.global.prod.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f0fdf4;color:#0f172a}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;padding:14px}
h2{margin:4px 0 10px;font-size:18px}.box{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0}
input,select,button{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid #cbd5e1;max-width:100%}
input,select{width:100%;margin:3px 0}button{cursor:pointer;background:#fff}
.g{background:#16a34a;color:#fff;border-color:#16a34a}.r{background:#dc2626;color:#fff;border-color:#dc2626}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tabs button.on{background:#16a34a;color:#fff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.sm{font-size:12px;color:#64748b}
.s{padding:6px 10px}.s.on{background:#16a34a;color:#fff}.s.i.on{background:#2563eb}.s.a.on{background:#dc2626}
.n{width:62px;flex:none}.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#dcfce7;font-size:12px}
.tag.x{background:#fee2e2}.tag.w{background:#fef3c7}video{width:100%;border-radius:10px;display:none}table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border:1px solid #cbd5e1;padding:5px;text-align:left;font-size:13px}@page{size:A4;margin:10mm}.pr{display:none}.hal{page-break-after:always}.sg{display:grid;gap:4px}.st{padding:4px 2px;font-size:11px;line-height:1.2;min-height:46px;text-align:center;border:1px solid #cbd5e1;overflow:hidden}.st.pil{outline:3px solid #16a34a}
.k0{background:#dcfce7}.k1{background:#dbeafe}.k2{background:#fef3c7}.k3{background:#fce7f3}.k4{background:#ede9fe}.k5{background:#ffedd5}
.pr .grid{display:grid;gap:3mm}.pr .kursi{border:1.5px solid #000;border-radius:2mm;padding:3mm;text-align:center;min-height:24mm}.pr .kursi b{font-size:20px;display:block}.pr .papan{border:2px solid #000;text-align:center;padding:2mm;margin:4mm 0;font-weight:700}
.pr table{width:100%;border-collapse:collapse}.pr td,.pr th{border:1px solid #000;padding:3px 5px;text-align:left}.pr td.k{height:9mm}.pr .lab{border:1.5px dashed #000;padding:4mm;text-align:center;height:60mm;break-inside:avoid}.pr .lab .no{font-size:44px;font-weight:800;line-height:1.1}
@media print{#app>.row,#app>p{display:none}body.m-hadir .pr-hadir,body.m-denah .pr-denah{display:block}body.m-label .pr-label{display:grid;grid-template-columns:1fr 1fr;gap:5mm}}.bar{height:6px;background:#e2e8f0;border-radius:9px;margin:2px 0 8px}.bar i{display:block;height:100%;background:#16a34a;border-radius:9px}.kw{display:flex;flex-wrap:wrap;gap:4mm}.kartu{width:85.6mm;height:54mm;border:1px solid #16a34a;border-radius:3mm;padding:4mm;display:flex;gap:4mm;align-items:center;break-inside:avoid}.qr{width:34mm;flex:none}.qr svg{width:100%;height:auto}@media print{.noprint,.tabs{display:none}#app{padding:0;max-width:none}}
.rap{direction:rtl;font:13px/1.4 "Noto Naskh Arabic","Amiri",serif;color:#000}.rap h3{margin:2px 0;text-align:center;font-size:17px}.rap .nb{table-layout:fixed}.rap .nb td{border:0;vertical-align:top;text-align:right;width:50%}.rap .tt td{text-align:center;width:33%}
.rap table{width:100%;border-collapse:collapse;text-align:center;margin:6px 0}.rap td,.rap th{border:1px solid #222;padding:3px 4px}.rap th{background:#e8e8e8}.rap .lt{direction:ltr}.rap .gagal{font-style:italic}.rap .is{font-size:18px;font-weight:700}
</style></head><body><div id="app">
<template v-if="!tk">
  <h2>Ujian · Masuk</h2>
  <div class="row"><button :class="{g:!wali}" @click="wali=false">Guru / Panitia</button><button :class="{g:wali}" @click="wali=true">Wali Santri</button></div>
  <input v-model="u" :placeholder="wali?'NIS santri':'Username'" @keyup.enter="masuk">
  <input v-model="p" type="password" :placeholder="wali?'PIN':'Password'" @keyup.enter="masuk">
  <button class="g" style="width:100%" @click="masuk">Masuk</button><p class="sm">{{msg}}</p>
</template>
<template v-else>
  <div class="row"><div><b>{{nama}}</b><div class="sm">{{role}}</div></div><a href="/" class="sm" style="flex:none;margin-right:8px">Portal</a><button style="flex:none" @click="keluar">Keluar</button></div>
  <div class="tabs"><button v-for="t in tabs" :key="t[0]" :class="{on:tab===t[0]}" @click="buka(t[0])">{{t[1]}}<span v-if="t[0]==='notif'&&baru"> ({{baru}})</span></button></div>
  <p class="sm" v-if="info">{{info}}</p>
  <p class="sm" v-if="tunda||!online">{{online?'':'Tidak ada sinyal. '}}{{tunda}} data tersimpan di perangkat. <button class="s" @click="kirimTunda">Kirim sekarang</button></p>

  <!-- HADIR -->
  <div v-if="tab==='hadir'">
    <select v-model="uj" @change="muatHadir"><option value="">Pilih ujian</option><option v-for="x in d.ujian" :value="x.ID">{{x.Nama}}</option></select>
    <input v-model="ruang" placeholder="Ruang, mis. Ruang 1">
    <div class="row"><input v-model="nis" placeholder="Ketik atau scan NIS" @keyup.enter="catat('Hadir',nis)"><button class="g" style="flex:none" @click="catat('Hadir',nis)">Hadir</button><button style="flex:none" @click="kamera">Kamera</button></div>
    <video id="cam" playsinline></video>
    <input v-model="cari" placeholder="Cari nama santri">
    <div class="box" v-for="s in daftar" :key="s.NIS"><b>{{s.Nama}}</b> <span class="sm">{{s.NIS}} · {{s.Kelas}}</span>
      <div class="row"><button v-for="st in ['Hadir','Izin','Sakit','Alfa']" :key="st" :class="['s',st[0].toLowerCase(),{on:status(s.NIS)===st}]" @click="catat(st,s.NIS)">{{st}}</button></div></div>
    <button class="g" style="width:100%" @click="tutup">Ruang selesai, beri tahu guru</button>
  </div>

  <!-- NILAI -->
  <div v-if="tab==='nilai'">
    <select v-model="itemId" @change="muatSkor"><option value="">Pilih mapel yang Anda nilai</option><option v-for="i in d.items" :value="i.ID">{{i.Mapel}} · {{i.Jenis}} · {{i.Kelas}}</option></select>
    <template v-if="sk">
      <p>Status: <span :class="['tag',sk.status==='Ditolak'?'x':sk.status==='Menunggu'?'w':'']">{{sk.status}}</span> <span class="sm" v-if="sk.alasan">{{sk.alasan}}</span></p>
      <div class="sm" v-if="sk.item.Jenis==='Kitab'">Koreksian kitab hanya menentukan boleh atau tidaknya ikut imtihan. Nilainya tidak masuk raport.</div>
      <div class="box" v-if="sk.item.Jenis==='PG'"><b>Impor hasil scan LJK</b><div class="sm">File CSV: kolom NIS, lalu kolom jawaban berjudul 1, 2, 3 (atau Q1, Q2, ...).</div><input type="file" accept=".csv,.txt" @change="bacaCsv"></div>
      <div class="box" v-for="s in sk.santri" :key="s.nis"><b>{{s.nama}}</b> <span class="sm">{{s.hadir||'belum dicatat hadir'}}</span>
        <div class="row" v-for="(a,i) in sk.aspek" :key="i"><span>{{a.n}} <span class="sm">/{{a.m}}</span></span>
          <input class="n" type="number" min="0" :max="a.m" v-model.number="s.detail[i]" @change="simpan(s)"></div>
        <b>Total: {{s.total===''?'-':s.total}}</b></div>
      <button class="g" style="width:100%" :disabled="sk.status==='Disetujui'" @click="ajukan">Ajukan ke panitia</button>
    </template>
  </div>

  <!-- VERIFIKASI -->
  <div v-if="tab==='verif'">
    <p v-if="!vf.length" class="sm">Tidak ada antrean verifikasi.</p>
    <div class="box" v-for="v in vf" :key="v.id"><b>{{v.label}}</b><div class="sm">Penguji: {{v.penguji}} · terisi {{v.terisi}} dari {{v.total}} santri</div>
      <div class="row"><button class="g" @click="putus(v,true)">Setujui</button><button class="r" @click="putus(v,false)">Tolak</button></div></div>
  </div>

  <!-- NOTIF -->
  <div v-if="tab==='notif'"><p v-if="!nt.length" class="sm">Belum ada notifikasi.</p>
    <div class="box" v-for="n in nt" :key="n.ID"><b>{{n.Judul}}</b><div>{{n.Isi}}</div><div class="sm">{{n.Waktu}}</div></div></div>

  <!-- ATUR -->
  <div v-if="tab==='atur'">
    <div class="box"><b>Buat ujian</b><input v-model="fu.nama" placeholder="Nama, mis. Ujian Semester 1">
      <div class="row"><select v-model="fu.semester"><option>Ganjil</option><option>Genap</option></select><input v-model="fu.tahun" placeholder="2026/2027"></div>
      <div class="row"><input type="date" v-model="fu.mulai"><input type="date" v-model="fu.selesai"></div><button class="g" @click="buatUjian">Simpan ujian</button></div>
    <div class="box"><b>Tambah item penilaian</b>
      <select v-model="fi.idUjian"><option value="">Ujian</option><option v-for="x in d.ujian" :value="x.ID">{{x.Nama}}</option></select>
      <input v-model="fi.kelas" placeholder="Kelas (sama persis dengan data santri)"><input v-model="fi.mapel" placeholder="Mapel / kitab">
      <select v-model="fi.jenis"><option>Tulis</option><option>PG</option><option>Lisan</option><option>Praktek</option><option>Kitab</option></select>
      <input v-model="fi.penguji" placeholder="Username penguji / guru">
      <input v-model="fi.aspek" placeholder="Esai: Soal 1:30,Soal 2:70 · PG: PG:ABCDA (kunci)">
      <button class="g" @click="buatItem">Simpan item</button></div>
  </div>

  <!-- WHATSAPP -->
  <div v-if="tab==='wa'">
    <div class="box" v-if="wa"><b>Status</b><p class="sm">Gateway: {{wa.aktif?'diatur':'belum diatur'}} · Jadwal kirim: {{wa.jadwal?'aktif':'belum dipasang'}}</p>
      <p>Menunggu {{wa.hitung.Menunggu}} · Terkirim {{wa.hitung.Terkirim}} · Gagal {{wa.hitung.Gagal}}</p>
      <button style="width:100%" @click="waProses">Kirim antrian sekarang</button>
      <div class="sm" v-for="(x,i) in wa.terakhir" :key="i">{{x.waktu}} · {{x.nomor}} · {{x.status}} {{x.catatan}}</div></div>
    <div class="box"><b>Uji kirim</b><input v-model="fw.nomor" placeholder="Nomor Anda, mis. 0812xxxxxxx"><button style="width:100%" @click="waUji">Uji kirim</button></div>
    <div class="box"><b>Pengingat ujian ke wali</b><select v-model="fw.uj"><option value="">Pilih ujian</option><option v-for="x in d.ujian" :value="x.ID">{{x.Nama}}</option></select>
      <select v-model="fw.kelas"><option value="">Pilih kelas</option><option v-for="k in kelasList" :key="k">{{k}}</option></select>
      <button class="g" style="width:100%" :disabled="!fw.uj||!fw.kelas" @click="waIngat">Masukkan ke antrian</button>
      <p class="sm">Nomor wali diambil dari kolom No_HP data santri. Pesan nilai terbit dikirim otomatis saat panitia menyetujui, tanpa memuat angka nilai.</p></div>
  </div>

  <!-- AKUN -->
  <div v-if="tab==='akun'">
    <div class="box noprint"><b>{{role==='Wali'?'Ganti PIN':'Ganti kata sandi'}}</b>
      <input v-model="fs.lama" type="password" placeholder="Saat ini"><input v-model="fs.baru" type="password" :placeholder="role==='Wali'?'PIN baru (6–8 angka)':'Baru (minimal 8 karakter)'"><input v-model="fs.ulang" type="password" placeholder="Ulangi yang baru">
      <button class="g" style="width:100%" @click="gantiSandi">Simpan</button></div>
    <template v-if="d.bisaAtur">
      <div class="box noprint" v-if="d.izin&&d.izin.includes('administrator.user.reset')"><b>Reset sandi pengguna</b><input v-model="fs.user" placeholder="Username"><button style="width:100%" @click="resetSandi">Reset</button>
        <p class="sm" v-if="fs.temp">Sandi sementara: <b>{{fs.temp}}</b>. Sampaikan langsung dan minta segera diganti. Tidak ditampilkan lagi.</p></div>
      <div class="box"><div class="noprint"><b>Buat PIN wali</b><select v-model="fs.kelas"><option value="">Pilih kelas</option><option v-for="k in kelasList" :key="k">{{k}}</option></select>
        <label class="sm"><input type="checkbox" v-model="fs.ulangPin" style="width:auto"> Buat ulang semua, bukan hanya yang belum punya</label>
        <div class="row"><button class="g" :disabled="!fs.kelas" @click="buatPin">Buat PIN</button><button v-if="pins.length" @click="cetak">Cetak slip</button></div>
        <p class="sm">PIN hanya tampil sekali di sini. Cetak lalu serahkan lewat wali kelas.</p></div>
        <table v-if="pins.length"><tr><th>Nama</th><th>NIS</th><th>PIN</th></tr><tr v-for="p in pins" :key="p.nis"><td>{{p.nama}}</td><td>{{p.nis}}</td><td><b>{{p.pin}}</b></td></tr></table></div>
    </template>
  </div>

  <!-- CEK SIAP -->
  <div v-if="tab==='siap'"><button class="g" style="width:100%" @click="jalankanCek">Jalankan pemeriksaan kesiapan</button>
    <div class="box" v-for="(c,i) in cek" :key="i"><b>{{c.s==='ok'?'✓':c.s==='warn'?'⚠':'✗'}}</b> {{c.t}}</div>
    <div class="box"><b>Cadangan data</b><p class="sm">Dibuat otomatis tiap hari. Cadangan juga bisa dibuat sekarang, aman saat server berjalan.</p><button style="width:100%" @click="cadang">Cadangkan sekarang</button><div class="sm" v-for="b in cad" :key="b.nama">{{b.nama}} · {{Math.round(b.ukuran/1024)}} KB</div></div></div>

  <!-- BANTUAN -->
  <div v-if="tab==='bantuan'"><details class="box" v-for="p in panduan" :key="p.t"><summary>{{p.t}}</summary><ol><li v-for="(s,i) in p.s" :key="i">{{s}}</li></ol></details></div>

  <!-- DENAH -->
  <div v-if="tab==='denah'">
   <div class="noprint">
    <select v-model="dn.uj" @change="denahMuat"><option value="">Pilih ujian</option><option v-for="x in d.ujian" :value="x.ID">{{x.Nama}}</option></select>
    <template v-if="dn.uj">
     <div class="box"><b>{{dn.f.id?'Ubah ruang':'Tambah ruang'}}</b><input v-model="dn.f.nama" placeholder="Nama ruang, mis. Ruang 1">
      <div class="row"><input type="number" v-model.number="dn.f.kapasitas" placeholder="Kapasitas"><input type="number" v-model.number="dn.f.kolom" placeholder="Kolom"></div>
      <div class="sm">Kelas di ruang ini (boleh lebih dari satu, kursi akan diselang):</div>
      <label v-for="k in kelasList" :key="k" class="sm" style="display:inline-block;margin-right:10px"><input type="checkbox" :value="k" v-model="dn.f.kelas" style="width:auto"> {{k}}</label>
      <div class="row"><button class="g" @click="simpanRuang">Simpan ruang</button><button v-if="dn.f.id" @click="Object.assign(dn.f,{id:'',nama:'',kapasitas:30,kolom:5,kelas:[]})">Batal</button></div></div>
     <button class="g" style="width:100%" :disabled="!dn.ruang.length" @click="susun">Susun kursi otomatis</button>
     <div class="box" v-if="dn.hasil&&dn.hasil.belum.length"><b>⚠ {{dn.hasil.belum.length}} santri belum dapat kursi</b><div class="sm">Tambah kapasitas atau ruang untuk kelas: {{[...new Set(dn.hasil.belum.map(x=>x.kelas))].join(', ')}}</div></div>
     <div class="row" v-if="dn.kursi.length"><button @click="cetakJenis('hadir')">Cetak daftar hadir</button><button @click="cetakJenis('denah')">Cetak denah tempel</button><button @click="cetakJenis('label')">Cetak label meja</button></div>
     <div class="box" v-for="r in denahRuang" :key="r.ID"><div class="row"><div><b>{{r.Nama}}</b> <span class="sm">{{r.Kelas}} · {{r.terisi}}/{{r.Kapasitas}} kursi</span></div><button class="s" style="flex:none" @click="editRuang(r)">Ubah</button><button class="s" style="flex:none" @click="hapusRuang(r)">Hapus</button></div>
      <div class="sm">Ketuk satu kursi terisi, lalu kursi lain untuk memindah atau menukar.</div>
      <div class="sg" :style="{gridTemplateColumns:'repeat('+r.Kolom+',1fr)'}"><button v-for="k in r.kursi" :key="k.no" :class="['st',k.nis?'k'+kidx(k.kelas):'',{pil:dn.pilih&&dn.pilih.r===r.ID&&dn.pilih.no===k.no}]" @click="klikKursi(r,k)"><b>{{k.no}}</b><br>{{k.nama.split(' ')[0]}}<br><span class="sm">{{k.kelas}}</span></button></div></div>
    </template>
   </div>
   <div class="pr pr-hadir"><template v-for="r in denahRuang" :key="r.ID">
     <section class="hal"><h3 style="text-align:center">DAFTAR HADIR {{ujNama.toUpperCase()}}</h3><p>Ruang: <b>{{r.Nama}}</b> · Kelas: {{r.Kelas}} · Hari/Tanggal: ........................</p>
      <table><tr><th>Kursi</th><th>Nama</th><th>NIS</th><th>Kelas</th><th>Hadir</th><th>Paraf</th></tr><tr v-for="k in r.kursi.filter(x=>x.nis)" :key="k.no"><td class="k">{{k.no}}</td><td>{{k.nama}}</td><td>{{k.nis}}</td><td>{{k.kelas}}</td><td></td><td></td></tr></table></section>
     <section class="hal"><h3 style="text-align:center">BERITA ACARA PENGAWAS</h3><p>Ruang: <b>{{r.Nama}}</b> · Jumlah peserta: {{r.terisi}} · Hadir: ........ · Tidak hadir: ........</p>
      <table><tr><th>Hari/Tanggal</th><th>Mata pelajaran</th><th>Jam</th><th>Nama pengawas</th><th>Tanda tangan</th></tr><tr v-for="n in 8" :key="n"><td class="k"></td><td></td><td></td><td></td><td></td></tr></table><p>Catatan kejadian:</p><div style="border:1px solid #000;height:40mm"></div></section></template></div>
   <div class="pr pr-denah"><section class="hal" v-for="r in denahRuang" :key="r.ID"><h2 style="text-align:center;margin:0">RUANG {{r.Nama.toUpperCase()}}</h2><p style="text-align:center;margin:2px">{{ujNama}} · Kelas {{r.Kelas}}</p>
     <div class="papan">PAPAN TULIS / DEPAN KELAS</div><div class="grid" :style="{gridTemplateColumns:'repeat('+r.Kolom+',1fr)'}"><div class="kursi" v-for="k in r.kursi" :key="k.no"><b>{{k.no}}</b><div>{{k.nama}}</div><small>{{k.kelas}}</small></div></div></section></div>
   <div class="pr pr-label"><div class="lab" v-for="x in semuaKursi" :key="x.ruang+x.no"><small>{{x.ruang}} · {{ujNama}}</small><div class="no">{{x.no}}</div><b>{{x.nama}}</b><div>NIS {{x.nis}} · {{x.kelas}}</div></div></div>
  </div>

  <!-- KARTU -->
  <div v-if="tab==='kartu'">
    <div class="noprint"><select v-model="kelasK"><option value="">Pilih kelas</option><option v-for="k in kelasList" :key="k">{{k}}</option></select>
      <button class="g" style="width:100%" :disabled="!kartu.length" @click="cetak">Cetak {{kartu.length}} kartu</button>
      <select v-model="dn.uj" @change="denahMuat"><option value="">Tanpa nomor ruang dan kursi</option><option v-for="x in d.ujian" :value="x.ID">{{x.Nama}}</option></select>
      <p class="sm">Ukuran 8,5 × 5,4 cm. Di pengaturan cetak pilih skala 100% dan margin minimal. QR berisi NIS, dibaca oleh kamera di menu Hadir.</p></div>
    <div class="kw"><div class="kartu" v-for="s in kartu" :key="s.NIS"><div class="qr" v-html="qr(s.NIS)"></div><div><div class="sm">SIPP NU Darussalam</div><b>{{s.Nama}}</b><div>{{s.Kelas}}</div><div class="sm">NIS {{s.NIS}}</div><div v-if="seat(s.NIS)"><b>{{seat(s.NIS)}}</b></div></div></div></div>
  </div>

  <!-- DASHBOARD -->
  <div v-if="tab==='dash'">
    <select v-model="dUj" @change="muatDash"><option value="">Pilih ujian</option><option v-for="x in d.ujian" :value="x.ID">{{x.Nama}}</option></select>
    <input v-model="dCari" placeholder="Filter kelas atau mapel">
    <p class="sm">{{dash.length}} item · {{dash.filter(x=>x.status==='Disetujui').length}} disetujui · {{dash.filter(x=>x.status==='Menunggu').length}} menunggu verifikasi · {{dash.filter(x=>x.status==='Ditolak').length}} ditolak · {{dash.filter(x=>x.status==='Draft').length}} belum diajukan</p>
    <div class="box" v-for="i in dashF" :key="i.id"><b>{{i.mapel}} · {{i.jenis}} · {{i.kelas}}</b> <span :class="['tag',i.status==='Ditolak'?'x':i.status==='Menunggu'?'w':'']">{{i.status}}</span>
      <div class="sm">Penguji: {{i.penguji}}</div>
      <div class="sm">Hadir {{i.hadir}} dari {{i.total}}</div><div class="bar"><i :style="{width:pct(i.hadir,i.total)+'%'}"></i></div>
      <div class="sm">Dinilai {{i.terisi}} dari {{i.total}}</div><div class="bar"><i :style="{width:pct(i.terisi,i.total)+'%'}"></i></div></div>
  </div>

  <!-- RAPORT -->
  <div v-if="tab==='raport'">
    <div class="noprint"><select v-if="role!=='Wali'" v-model="rpNis"><option value="">Pilih santri</option><option v-for="s in d.santri" :value="String(s.NIS)">{{s.Nama}} · {{s.Kelas}}</option></select>
      <div class="row"><select v-model="rpSem"><option>Ganjil</option><option>Genap</option></select><input v-model="rpTahun" placeholder="2026/2027"></div>
      <label class="sm"><input type="checkbox" v-model="arab" style="width:auto"> Angka Arab (١٢٣)</label>
